packages:
  - "packages/*"
  - "apps/*"
allowBuilds:
  esbuild: true
  rs-module-lexer: true
# Security floors for transitive dev dependencies (Dependabot alerts).
overrides:
  brace-expansion@>=4 <5.0.12: ^5.0.12
  js-yaml@>=3 <3.15.2: ^3.15.2
  js-yaml@>=4 <4.3.2: ^4.3.2
  minimatch@>=7 <11.0.1: ^11.0.1
  nanoid@<3.3.18: ^3.3.18
  postcss@<8.5.23: ^8.5.23
  qs@<6.17.0: ^6.17.0
  source-map-js@<1.2.2: ^1.2.2
  vite@>=6 <6.4.4: ^6.4.4
