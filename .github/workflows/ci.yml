name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      # pnpm 11 requires Node >=22.13 (fails with ERR_UNKNOWN_BUILTIN_MODULE on node:sqlite otherwise) —
      # keep in sync with the root package.json's engines.node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium, Firefox, and WebKit engines for the cross-browser test suite below.
      - run: pnpm exec playwright install --with-deps chromium firefox webkit

      - run: pnpm lint
      # The English message catalog (packages/translations/src/en.ts) matches the components' term() calls.
      - run: pnpm messages:check
      - run: pnpm typecheck
      - run: pnpm build
      # Each package bundled alone and gzipped against tools/size-limits.json.
      - run: pnpm size
      # Every element server-rendered, then hydrated in Chromium: fails when hydration
      # throws or changes what an element shows (reads the custom-elements manifests).
      - run: pnpm analyze
      - run: pnpm hydration
      # React wrappers, JSX and Vue typings generated from the manifests: up to date, typecheck with
      # fixtures, and a React app clicking a wrapped and a bare element in Chromium.
      - run: pnpm bindings:check
      # Every element rendered under a strict Content-Security-Policy with Trusted Types enforced (no inline
      # styles, no unsafe-inline, only the lit-html policy), plus a source scan for style bindings and HTML sinks.
      - run: pnpm csp
      # The per-package SBOMs the release ships (dist/sbom.cdx.json) can be generated.
      - run: pnpm sboms

      # Each package's web-test-runner binds a fixed dev-server port, so test tasks can't run
      # turbo's default full parallelism without colliding — keep this sequential.
      - run: pnpm test:cross-browser
