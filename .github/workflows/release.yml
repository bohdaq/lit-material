name: Release

# Publishes to npm with trusted publishing (OIDC): no npm token is stored in
# GitHub. Each package trusts this workflow file on npmjs.com, set up once
# with tools/trust-publishing.sh. A new trust expires after 48 h unless a
# publish uses it, so an E404 on PUT usually means a missing or expired trust.
#
# On every push to main: unreleased changesets are applied (versions and
# CHANGELOGs) and committed to main as "Version packages", then every package
# whose version isn't on npm yet is published, with provenance, and tagged.
# No pull request: pushing a changeset is the release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write  # the Version packages commit and the tags
  id-token: write  # OIDC token npm exchanges for a short-lived publish token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      # Trusted publishing needs npm >= 11.5.1; node 24 ships npm 11. No
      # `registry-url`: it writes an .npmrc with an empty NODE_AUTH_TOKEN, which
      # makes `npm info` fail, so changesets thought every package unpublished.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # npm 11, not 12: npm 12's `npm info --json` returns an array, which
      # changesets reads as "not published" for every package.
      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile

      - name: Apply changesets
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            pnpm run version
            pnpm install --lockfile-only
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A .changeset packages pnpm-lock.yaml
            git commit -m "Version packages"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changesets: nothing to version."
          fi

      # npm trust is per package and needs the package to exist, so a new
      # package can't be published from here: mark it private for this run
      # (not committed) and print the commands for its first publish.
      - name: Skip packages not on npm yet
        run: |
          new=()
          for dir in packages/*/; do
            dir=${dir%/}
            pkg=$(node -p "require('./$dir/package.json').name")
            [ "$(node -p "Boolean(require('./$dir/package.json').private)")" = true ] && continue
            if npm view "$pkg" name 2>&1 | grep -q E404; then
              (cd "$dir" && npm pkg set private=true)
              new+=("${dir#packages/}")
            fi
          done
          [ ${#new[@]} -eq 0 ] && exit 0
          echo "::warning::New on npm, not published: ${new[*]}. Run tools/first-publish.sh ${new[*]}"
          { echo "### New packages, not published"; echo
            echo "Run \`tools/first-publish.sh ${new[*]}\` (logged in to npm): it creates them, trusts this workflow and re-runs it."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          pnpm run release
          git push origin --tags
