name: Release

# Publishes to npm with trusted publishing (OIDC): no npm token is stored in
# GitHub. Each package trusts this workflow file on npmjs.com, set up once
# with tools/trust-publishing.sh.
#
# On every push to main: if there are unreleased changesets, this opens (or
# updates) a "Version packages" pull request; merging it publishes every
# package whose version isn't on npm yet, with provenance, and pushes tags.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write       # tags and the version-packages branch
  pull-requests: write  # the version-packages pull request
  id-token: write       # OIDC token npm exchanges for a short-lived publish token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      # Trusted publishing needs npm >= 11.5.1; node 24 ships npm 11. No
      # `registry-url`: it writes an .npmrc with an empty NODE_AUTH_TOKEN, which
      # makes `npm info` fail, so changesets thought every package unpublished.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # npm 11, not 12: npm 12's `npm info --json` returns an array, which
      # changesets reads as "not published" for every package.
      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile

      - uses: changesets/action@v1
        with:
          version: pnpm run version
          publish: pnpm run release
          commit: "Version packages"
          title: "Version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
