name: Release

# Publishes to npm with trusted publishing (OIDC): no npm token is stored in
# GitHub. Each package trusts this workflow file on npmjs.com, set up once
# with tools/trust-publishing.sh.
#
# On every push to main: unreleased changesets are applied (versions and
# CHANGELOGs) and committed to main as "Version packages", then every package
# whose version isn't on npm yet is published, with provenance, and tagged.
# No pull request: pushing a changeset is the release.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write  # the Version packages commit and the tags
  id-token: write  # OIDC token npm exchanges for a short-lived publish token

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.10.0

      # Trusted publishing needs npm >= 11.5.1; node 24 ships npm 11. No
      # `registry-url`: it writes an .npmrc with an empty NODE_AUTH_TOKEN, which
      # makes `npm info` fail, so changesets thought every package unpublished.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # npm 11, not 12: npm 12's `npm info --json` returns an array, which
      # changesets reads as "not published" for every package.
      - run: npm install -g npm@11.21.1

      - run: pnpm install --frozen-lockfile

      - name: Apply changesets
        run: |
          if ls .changeset/*.md 2>/dev/null | grep -qv README.md; then
            pnpm run version
            pnpm install --lockfile-only
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A .changeset packages pnpm-lock.yaml
            git commit -m "Version packages"
            git pull --rebase origin main
            git push origin HEAD:main
          else
            echo "No changesets: nothing to version."
          fi

      - name: Publish
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          pnpm run release
          git push origin --tags
