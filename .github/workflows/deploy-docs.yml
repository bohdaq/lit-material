name: Deploy docs to GitHub Pages

# The docs live at https://lit.rws8.tech (apps/site, deployed to the rws8.tech VM).
# GitHub Pages now only serves tools/pages-redirect, which sends every old
# bohdaq.github.io/lit-material/* URL to its page on the new site.

on:
  push:
    branches: [main]
  # Lets this be re-run manually from the Actions tab without needing a new commit.
  workflow_dispatch:

# Only one deployment at a time; a newer push cancels an in-flight older one rather than queuing behind it.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: tools/pages-redirect

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
